name: File size

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: scripts/check-file-size.test.sh
      - run: scripts/check-file-size --all
      - name: Baseline and exemptions only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-file-size --against "origin/$BASE_REF"
