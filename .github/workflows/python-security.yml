name: Python security

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/python-security.yml"
      - "python/requirements.txt"
      - "python/security-lock.txt"
      - "scripts/install_chatterbox.py"
  pull_request:
    paths:
      - ".github/workflows/python-security.yml"
      - "python/requirements.txt"
      - "python/security-lock.txt"
      - "scripts/install_chatterbox.py"
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.10.1
      - run: timeout 60s ./scripts/pip_audit.sh
